name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy app

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" pytest-socket
      - name: Offline suite (no env secrets, no network)
        run: >
          env -u OPENAI_API_KEY -u API_AUTH_TOKEN -u SLACK_BOT_TOKEN
          -u SLACK_SIGNING_SECRET -u MCP_AUTH_MODE
          python -B -m pytest -q -p no:cacheprovider --disable-socket --allow-unix-socket

  test-optional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with MCP extras
        run: pip install -e ".[dev,mcp]"
      - name: Full suite
        run: python -B -m pytest -q -p no:cacheprovider

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t grounded-rag-service:ci .
      - name: Smoke /health
        run: |
          docker run -d --name grounded-rag-ci -p 8000:8000 grounded-rag-service:ci
          cleanup() { docker stop grounded-rag-ci >/dev/null 2>&1 || true; docker rm grounded-rag-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "health check failed" >&2
          docker logs grounded-rag-ci >&2 || true
          exit 1

  benchmark:
    # Retrieval quality gate on a public benchmark (BEIR SciFact). Separate
    # from `test` because it downloads a dataset, so it needs network while
    # the offline suite is asserted to have none. Deterministic: no model
    # download, no API key, no LLM judge, so the threshold cannot flap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: BM25 lane on BEIR SciFact
        run: python -B scripts/eval_beir.py --lanes bm25 --threshold 0.58 --json beir-scifact.json
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: beir-scifact-metrics
          path: beir-scifact.json
